name: Build and Promote Integration to main

on:

  # ============================================================
  # Automatically trigger when a PR is MERGED into integration
  # ============================================================

  pull_request:
    types:
      - closed
    branches:
      - integration

  # ============================================================
  # Allow manual execution
  # ============================================================

  workflow_dispatch:
    inputs:
      merge_to_main:
        description: "Merge integration to main after successful build?"
        required: true
        default: true
        type: boolean


# ==============================================================
# Permissions
# ==============================================================

permissions:
  contents: write


jobs:

  # ============================================================
  # BUILD & VALIDATION
  # ============================================================

  build:
    name: Build and Validate

    # ------------------------------------------------------------
    # Run only when:
    #
    # 1. A PR was actually merged
    # 2. The PR target branch was integration
    #
    # OR
    #
    # 3. Workflow was manually triggered
    # ------------------------------------------------------------

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'integration'
      )

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout integration
      # --------------------------------------------------------

      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0


      # --------------------------------------------------------
      # Display build information
      # --------------------------------------------------------

      - name: Display build information
        run: |

          echo "======================================"
          echo "BUILD INFORMATION"
          echo "======================================"

          echo "Branch        : integration"
          echo "Commit        : $(git rev-parse HEAD)"

          echo "Commit Message:"
          git log -1 --pretty=%B

          echo "======================================"


      # --------------------------------------------------------
      # Display PR information
      # --------------------------------------------------------

      - name: Display PR information
        if: github.event_name == 'pull_request'
        run: |

          echo "======================================"
          echo "PULL REQUEST INFORMATION"
          echo "======================================"

          echo "PR Number     : #${{ github.event.pull_request.number }}"
          echo "PR Title      : ${{ github.event.pull_request.title }}"
          echo "Source Branch : ${{ github.event.pull_request.head.ref }}"
          echo "Target Branch : ${{ github.event.pull_request.base.ref }}"
          echo "Merged        : ${{ github.event.pull_request.merged }}"
          echo "Merged By     : ${{ github.event.pull_request.merged_by.login }}"

          echo "======================================"


      # --------------------------------------------------------
      # Setup Java
      # --------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        run: |

          echo "======================================"
          echo "Starting build..."
          echo "======================================"

          # Replace with your actual build command
          #
          # ./build.sh

          echo "Build completed."


      # --------------------------------------------------------
      # Unit Tests
      # --------------------------------------------------------

      - name: Run tests
        run: |

          echo "======================================"
          echo "Running tests..."
          echo "======================================"

          # Replace with your actual test command
          #
          # ./test.sh

          echo "Tests completed."


      # --------------------------------------------------------
      # SonarQube
      # --------------------------------------------------------

      # Add SonarQube scan here
      #
      # - name: SonarQube Scan
      #   ...


      # --------------------------------------------------------
      # Veracode
      # --------------------------------------------------------

      # Add Veracode scan here
      #
      # - name: Veracode Scan
      #   ...


      # --------------------------------------------------------
      # Liquibase validation
      # --------------------------------------------------------

      # Add Liquibase validation here
      #
      # - name: Liquibase Validate
      #   ...


      # --------------------------------------------------------
      # Build completed
      # --------------------------------------------------------

      - name: Build successful
        run: |

          echo "======================================"
          echo "BUILD AND VALIDATION SUCCESSFUL"
          echo "======================================"



  # ============================================================
  # PROMOTE integration → main
  # ============================================================

  promote:
    name: Promote Integration to main

    needs: build

    # ------------------------------------------------------------
    # For PR merge:
    #   Build succeeds → promote
    #
    # For manual execution:
    #   Promote only when merge_to_main = true
    # ------------------------------------------------------------

    if: >
      needs.build.result == 'success' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.merge_to_main == true
        )
      )

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout integration
      # --------------------------------------------------------

      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0


      # --------------------------------------------------------
      # Verify branches
      # --------------------------------------------------------

      - name: Verify branches
        run: |

          echo "======================================"
          echo "VERIFYING BRANCHES"
          echo "======================================"

          git fetch origin main integration

          echo "Integration commit:"
          git rev-parse origin/integration

          echo "Main commit:"
          git rev-parse origin/main

          echo "======================================"


      # --------------------------------------------------------
      # Check whether integration is ahead of main
      # --------------------------------------------------------

      - name: Check integration changes
        id: changes
        run: |

          echo "======================================"
          echo "CHECKING integration → main"
          echo "======================================"

          git fetch origin main integration

          BEHIND_AHEAD=$(git rev-list \
            --left-right \
            --count \
            origin/main...origin/integration)

          BEHIND=$(echo "$BEHIND_AHEAD" | awk '{print $1}')
          AHEAD=$(echo "$BEHIND_AHEAD" | awk '{print $2}')

          echo "Main behind integration      : $AHEAD commit(s)"
          echo "Integration behind main      : $BEHIND commit(s)"

          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

          if [ "$AHEAD" -eq 0 ]; then

            echo "No new commits to promote."

            exit 0

          fi

          echo "Integration contains $AHEAD new commit(s)."
          echo "Changes are available for promotion."

          echo "======================================"


      # --------------------------------------------------------
      # Direct merge integration → main
      # --------------------------------------------------------

      - name: Merge integration into main
        if: steps.changes.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          echo "======================================"
          echo "PROMOTING integration → main"
          echo "======================================"

          echo "Source branch : integration"
          echo "Target branch : main"

          echo "Starting GitHub API merge..."

          RESPONSE=$(gh api \
            --method POST \
            "/repos/${{ github.repository }}/merges" \
            -f base='main' \
            -f head='integration' \
            -f commit_message='Automated promotion: integration → main')

          echo "Merge API response:"
          echo "$RESPONSE"

          # ----------------------------------------------------
          # Verify merge response
          # ----------------------------------------------------

          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then

            echo "ERROR: GitHub did not create a merge."

            exit 1

          fi

          echo "======================================"
          echo "INTEGRATION SUCCESSFULLY PROMOTED"
          echo "======================================"

          echo "integration → main completed successfully."


      # --------------------------------------------------------
      # Nothing to promote
      # --------------------------------------------------------

      - name: No changes to promote
        if: steps.changes.outputs.ahead == '0'
        run: |

          echo "======================================"
          echo "NO CHANGES TO PROMOTE"
          echo "======================================"

          echo "integration and main are already aligned."
