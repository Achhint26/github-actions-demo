name: Test Liquibase Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Runner identity
        shell: cmd
        run: |
          echo ===== RUNNER IDENTITY =====
          whoami
          echo USERNAME=%USERNAME%
          echo USERDOMAIN=%USERDOMAIN%
          echo USERPROFILE=%USERPROFILE%

      - name: Java
        shell: cmd
        run: |
          echo ===== JAVA =====
          where java
          java -version

      - name: Liquibase
        shell: cmd
        run: |
          echo ===== LIQUIBASE =====
          where liquibase
          liquibase --version

      - name: Snowflake JDBC
        shell: cmd
        run: |
          echo ===== SNOWFLAKE JDBC =====
          dir "C:\Users\AKSHATA RANI\actions-runner\liquibase_libs"

      - name: Test Snowflake JDBC Classpath
        shell: cmd
        run: |
          echo ===== EXPLICIT SNOWFLAKE JDBC CLASSPATH =====
          liquibase --classpath="C:\Users\AKSHATA RANI\actions-runner\liquibase_libs\snowflake-jdbc-4.3.2.jar" --version

      - name: LPM Check
        shell: cmd
        run: |
          echo ===== LIQUIBASE LPM =====
          liquibase lpm list

      - name: Runner environment
        shell: cmd
        run: |
          echo ===== ENVIRONMENT =====
          echo JAVA_HOME=%JAVA_HOME%
          echo LIQUIBASE_HOME=%LIQUIBASE_HOME%
          echo PATH=%PATH%
