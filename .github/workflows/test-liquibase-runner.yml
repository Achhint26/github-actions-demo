name: Test Liquibase Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:

      - name: Check Runner
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail {0}'
        run: |
          echo "======================================"
          echo "Runner Name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"
          echo "Runner Arch : $RUNNER_ARCH"
          echo "Workspace   : $GITHUB_WORKSPACE"
          echo "======================================"

      - name: Check Java
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail {0}'
        run: |
          echo "Java Version:"
          java -version

      - name: Check Git
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail {0}'
        run: |
          echo "Git Version:"
          git --version

      - name: Check Liquibase
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail {0}'
        run: |
          echo "Liquibase Version:"
          liquibase --version

      - name: Check Snowflake JDBC Driver
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail {0}'
        run: |
          JAR="/c/Users/AKSHATA RANI/liquibase_libs/snowflake-jdbc-4.3.2.jar"

          echo "Checking Snowflake JDBC driver..."

          if [ -f "$JAR" ]; then
            echo "Snowflake JDBC driver found:"
            echo "$JAR"
          else
            echo "ERROR: Snowflake JDBC driver NOT found:"
            echo "$JAR"
            exit 1
          fi
