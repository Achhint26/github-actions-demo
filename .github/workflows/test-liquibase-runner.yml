name: Test Liquibase Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    env:
      LIQUIBASE_CLASSPATH: 'C:\Users\AKSHATA RANI\actions-runner\liquibase_libs\snowflake-jdbc-4.3.2.jar'

    steps:

      - name: Runner identity
        shell: cmd
        run: |
          echo ===== RUNNER IDENTITY =====
          whoami
          echo USERNAME=%USERNAME%
          echo USERDOMAIN=%USERDOMAIN%
          echo USERPROFILE=%USERPROFILE%

      - name: Java
        shell: cmd
        run: |
          echo ===== JAVA =====
          where java
          java -version

      - name: Liquibase
        shell: cmd
        run: |
          echo ===== LIQUIBASE =====
          where liquibase
          liquibase --version

      - name: Snowflake JDBC
        shell: cmd
        run: |
          echo ===== SNOWFLAKE JDBC =====
          dir "C:\Users\AKSHATA RANI\actions-runner\liquibase_libs"

      - name: Verify Liquibase Snowflake Classpath
        shell: cmd
        run: |
          echo ===== LIQUIBASE CLASSPATH =====
          echo %LIQUIBASE_CLASSPATH%

          echo.
          echo ===== VERIFY JDBC JAR =====
          if exist "%LIQUIBASE_CLASSPATH%" (
            echo Snowflake JDBC JAR FOUND
          ) else (
            echo ERROR: Snowflake JDBC JAR NOT FOUND
            exit /b 1
          )

          echo.
          echo ===== LIQUIBASE VERSION =====
          liquibase --version

      - name: LPM Check
        shell: cmd
        run: |
          echo ===== LIQUIBASE LPM =====
          liquibase lpm list

      - name: Runner environment
        shell: cmd
        run: |
          echo ===== ENVIRONMENT =====
          echo JAVA_HOME=%JAVA_HOME%
          echo LIQUIBASE_HOME=%LIQUIBASE_HOME%
          echo LIQUIBASE_CLASSPATH=%LIQUIBASE_CLASSPATH%
          echo PATH=%PATH%
