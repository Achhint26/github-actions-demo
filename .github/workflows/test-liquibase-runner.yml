name: Test Liquibase Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Check runner identity
        shell: powershell
        run: |
          Write-Host "===== RUNNER IDENTITY ====="
          whoami
          $env:USERNAME
          $env:USERDOMAIN

      - name: Check runner environment
        shell: powershell
        run: |
          Write-Host "===== ENVIRONMENT ====="
          Write-Host "USERPROFILE = $env:USERPROFILE"
          Write-Host "JAVA_HOME = $env:JAVA_HOME"
          Write-Host "LIQUIBASE_HOME = $env:LIQUIBASE_HOME"
          Write-Host "PATH = $env:PATH"

      - name: Check Java
        shell: powershell
        run: |
          Write-Host "===== JAVA ====="
          java -version
          where.exe java

      - name: Check Liquibase
        shell: powershell
        run: |
          Write-Host "===== LIQUIBASE ====="
          where.exe liquibase
          liquibase --version

      - name: Check Snowflake JDBC
        shell: powershell
        run: |
          Write-Host "===== SNOWFLAKE JDBC ====="
          Get-ChildItem "C:\Users\AKSHATA RANI\actions-runner\liquibase_libs" |
          Where-Object { $_.Name -match "snowflake" }
